<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <link rel="stylesheet" href="/css/contact.css">
     <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      background: linear-gradient(135deg, #1d2671, #c33764);
      color: #333;
    }

    header {
      text-align: center;
      padding: 100px 20px;
      color: white;
    }

    header h1 { font-size: 3.5rem; margin-bottom: 15px; }
    header p { font-size: 1.3rem; opacity: 0.9; }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    .about-box {
      background: white;
      padding: 60px;
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      margin-bottom: 50px;
      animation: fadeUp 1s ease;
    }

    .about-box h2 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #1d2671;
    }

    .about-box p {
      line-height: 1.8;
      color: #555;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      margin-top: 30px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      transition: 0.4s;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1d2671, #c33764);
      top: 0;
      left: -100%;
      transition: 0.4s;
      z-index: 0;
    }

    .card:hover::before { left: 0; }

    .card:hover {
      transform: translateY(-10px) scale(1.05);
      color: white;
    }

    .card h3, .card p { position: relative; z-index: 1; }
    .card h3 { margin-bottom: 10px; }

    .timeline {
      margin-top: 60px;
    }

    .timeline h2 {
      text-align: center;
      color: white;
      margin-bottom: 40px;
      font-size: 2.5rem;
    }

    .timeline-item {
      background: white;
      margin: 20px auto;
      padding: 25px;
      border-radius: 15px;
      max-width: 700px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      animation: fadeUp 1s ease;
    }

    .timeline-item h4 { color: #c33764; margin-bottom: 10px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 30px;
      margin-top: 60px;
    }

    .stat {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    .stat:hover { transform: scale(1.05); }

    .stat h2 { color: #1d2671; font-size: 2.5rem; }
    .stat p { color: #555; }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 50px;
  background: linear-gradient(to right, #1d2671, #c33764);
  color: white;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.logo {
  font-size: 1.8rem;
  font-weight: 600;
}

.logo span {
  color: #ffd700;
}

.nav-links {
  list-style: none;
  display: flex;
  gap: 30px;
}

.nav-links li a {
  text-decoration: none;
  color: white;
  font-size: 1rem;
  transition: 0.3s;
}

.nav-links li a:hover {
  color: #ffd700;
}

  </style>
</head>
<body>
<nav class="navbar">
  <div class="logo">Edu<span>Spark</span></div>

  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/about">About</a></li>
    <li><a href="contact">Contact</a></li>
    <li><a href="/features">Features</a></li>
    <li><a href="/login">Login</a></li>
  </ul>
</nav>
<div class="bg">
    <img src="/images/c-1.jpg" class="side-img left-img" alt="Left Image">
    <img src="/images/c-2.jpg" class="side-img right-img" alt="Right Image">

    <div class="contact-box">
        <h2>Contact Us</h2>
        <p class="sub">You will hear from us at the earliest!</p>

        <!-- ✅ FORM START -->
        <form action="/contact" method="POST">

            <div class="input">
                <span>👤</span>
                <input type="text" name="name" placeholder="Full Name" required>
            </div>

            <div class="input">
                <span>✉️</span>
                <input type="email" name="email" placeholder="Email" required>
            </div>

            <div class="input">
                <span>📞</span>
                <input type="text" name="phone" placeholder="Phone" required>
            </div>

            <textarea name="message" placeholder="Any comment or your query" required></textarea>

            <button type="submit">Send</button>

        </form>
        <!-- ✅ FORM END -->

        <p class="bottom-text">
            You can also contact us at <b>+91-98765-43210</b>
        </p>
    </div>

</div>

</body>
</html>
